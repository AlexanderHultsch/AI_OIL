<table class="issues">
  <thead>
    <tr>
      {% for column in columns %}<th>
        {%- if column in sort %}<a class="sort" href="{{ sort[column].href }}">{{ column_labels[column] }}</a>{% if sort[column].arrow %} <span class="sort-arrow">{{ sort[column].arrow }}</span>{% endif %}
        {%- else %}{{ column_labels[column] }}{% endif -%}
      </th>{% endfor %}
    </tr>
  </thead>
  <tbody>
    {% for row in rows %}
    {% include "issues/_row.html" %}
    {% endfor %}
  </tbody>
</table>
