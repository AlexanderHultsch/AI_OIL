[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-oil"
version = "0.1.0"
description = "AI-assisted open issue list"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13",
    "keyring>=25",
    "requests>=2.31",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6.23",
    "pypdf>=4.0",
    "beautifulsoup4>=4.12",
    "extract-msg>=0.48",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
oil = "ai_oil.cli.main:main"

[project.entry-points."ai_oil.connectors"]
jira = "ai_oil.connectors.jira:JiraConnector"
manual = "ai_oil.connectors.manual:ManualConnector"
outlook = "ai_oil.connectors.outlook:OutlookConnector"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_oil = ["db/sql/*.sql", "db/migrations/*.py", "db/migrations/*.mako", "db/migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
markers = ["performance: SRCH-9 timing tests (large dataset)"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
